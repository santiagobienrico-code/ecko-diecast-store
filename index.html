
<!DOCTYPE html>
<html>
<head>
    <title>Ecko Diecast Collectibles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <div class="brand">
            <h1>ECKO<span> DIECAST</span></h1>
            <p>COLLECTIBLES</p>
        </div>

        <div class="login-box">
            <h2>Welcome Back!</h2>
            <p class="subtitle">
                Sign in to explore our diecast collection.
            </p>

            <form action="dashboard.html">
                <label>Username or Email</label>
                <input type="text"
                       placeholder="Enter your username"
                       required>

                <label>Password</label>
                <input type="password"
                       placeholder="Enter your password"
                       required>

                <button type="submit">LOGIN</button>
            </form>

           

    </div>

</body>
</html>
